<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sportswear By NOUR</title>
  <link rel="icon" href="assets/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500&family=Noto+Kufi+Arabic:wght@300;400;500&family=Heebo:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="css/style.css?v=32">
</head>
<body>

<div class="splash" id="splash" aria-hidden="true"><div class="sp-in"><div class="sp-logo"><span>N</span><span>O</span><span>U</span><span>R</span><b></b></div><i class="sp-line"></i></div></div>
<script>try{if(sessionStorage.getItem("sp"))document.getElementById("splash").hidden=true;else sessionStorage.setItem("sp","1")}catch(e){}</script>
<header><div class="wrap bar">
  <div class="lb"><button class="menu" id="menu" aria-label="menu"><i></i><i></i><i></i></button>
  <a class="logo" href="#top">NOUR<b></b></a></div>
  <div class="rb">
    <div class="langs" role="group" aria-label="Language">
      <button id="l-ar" data-l="ar">عربي</button><button id="l-he" data-l="he">עב</button><button id="l-en" data-l="en">EN</button>
    </div>
    <button class="bag" id="bag" aria-label="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span id="bagn" hidden>0</span></button>
  </div>
</div></header>

<main id="top">
  <section class="wrap hero">
    <h1 aria-label="NOUR"><span>N</span><span>O</span><span>U</span><span>R</span></h1>
    <p data-t="intro"></p>
    <a class="cta" href="#grid" data-t="shop"></a>
  </section>
  <section class="strip" id="strip">
    <img src="assets/brand/hero-arm2.jpg" alt="">
    <img src="assets/brand/hero-arm3.jpg" alt="">
    <img src="assets/brand/hero-pile2.jpg" alt="">
  </section>
  <div class="sdots" id="sdots"><button data-si="0" aria-pressed="true" aria-label="1"></button><button data-si="1" aria-pressed="false" aria-label="2"></button><button data-si="2" aria-pressed="false" aria-label="3"></button><span class="swipe">⟷</span></div>
  <section class="wrap">
    <div class="sec-h"><h2 id="ctitle"></h2><span id="ccount"></span></div>
    <div class="grid" id="grid"></div>
  </section>
  <section class="wrap story" id="story">
    <div class="story-pics" lang="ar">
      <img src="assets/brand/letter-story.jpg" alt="قصتنا: 2017 بدأ طريقي بعالم الرياضة… 2025 من هون إجى NOUR" loading="lazy">
      <img src="assets/brand/story-bags2.jpg" alt="NOUR" loading="lazy">
      <img src="assets/brand/letter-brand.jpg" alt="براند NOUR بيوفّرلك أواعي رياضة بتجمع ما بين الجودة العالية والراحة والمرونة" loading="lazy">
    </div>
    <div class="story-txt">
      <span class="label" data-t="ourStory"></span>
      <h2>NOUR<b></b></h2>
      <div class="yr"><span>2017</span><p data-t="s1"></p></div>
      <p class="quote" data-t="s2"></p>
      <div class="yr"><span>2025</span><p data-t="s3"></p></div>
    </div>
    <div class="story-img"><img src="assets/brand/story-bags.jpg" alt="NOUR" loading="lazy"></div>
    <div class="story-txt story-2">
      <p class="lead"><strong data-t="v0"></strong> <span data-t="v1"></span></p>
      <p data-t="v2"></p>
      <p class="quote" data-t="v3"></p>
      <p data-t="v4"></p>
      <div class="motto"><i></i>EMBRACE YOUR STRENGTH<i></i></div>
    </div>
  </section>
  <section class="wrap rules" id="rules">
    <h2 data-t="rules"></h2>
    <div class="rbox rmain">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15.5l2 2 4-4"/></svg>
      <p><span data-t="r1a"></span> <strong data-t="r1b"></strong> <span data-t="r1c"></span></p>
    </div>
    <div class="rbox rmain">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 9.5h.01M18 15.5h.01"/></svg>
      <p data-t="r2"></p>
    </div>
    <div class="rbox rlist">
      <b data-t="rno"></b>
      <div class="ri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 4l-5 3 2 4 2-1v10h10V10l2 1 2-4-5-3c-.5 1.5-2 2.5-4 2.5S8.5 5.5 8 4z"/></svg><span data-t="n1"></span></div>
      <div class="ri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="9" cy="10" r="3"/><circle cx="16" cy="15" r="2"/><circle cx="15" cy="7" r="1"/><circle cx="7" cy="17" r="1"/></svg><span data-t="n2"></span></div>
      <div class="ri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 12l9-9h8v8l-9 9z"/><circle cx="16" cy="8" r="1.3"/></svg><span data-t="n3"></span></div>
      <div class="ri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="4.5"/><path d="M7 6.5h.01M10 6.5h.01"/></svg><span data-t="n4"></span></div>
    </div>
    <p class="rthx" data-t="rthx"></p>
  </section>
</main>

<button class="totop" id="totop" aria-label="top" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
<div class="ov pdov" id="pd" hidden><div class="pdbox" id="pdbody" role="dialog" aria-modal="true"></div></div>
<div class="ov" id="drawer" hidden>
  <nav class="side"><div class="top"><span class="label" data-t="cats"></span><button class="x" data-close="drawer" aria-label="close">✕</button></div><div id="cats"></div></nav>
</div>

<div class="ov end" id="cart" hidden>
  <div class="side" id="cartbody"></div>
</div>

<footer><div class="wrap fo">
  <span class="logo">NOUR<b></b></span>
  <div class="links">
    <a href="https://instagram.com/sportswear_bynour" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg>
</a>
    <a href="mailto:hello@example.com" aria-label="Email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/></svg>
</a>
    <a id="wa-link" href="https://wa.me/972500000000" target="_blank" rel="noopener" aria-label="WhatsApp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20l1.3-4A8 8 0 1 1 8.4 19z"/><path d="M9 9.5c.3 2.3 2.2 4.3 4.5 4.8l1.2-1.1 1.8.8-.4 1.6c-3.3.3-7.3-3.5-7.1-6.9l1.6-.4.8 1.8z" fill="currentColor" stroke="none"/></svg>
</a>
  </div>
  <div class="copy">© 2026 Sportswear By NOUR</div>
</div></footer>

<script type="module" src="js/store.js?v=32"></script>
</body>
</html>
